<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Down Payment (DP) - IpuzPita MAKE UP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden text-slate-800">

    <!-- 1. SIDEBAR IKON KIRI -->
    <aside class="w-full md:w-20 bg-white border-r border-slate-100 flex md:flex-col items-center py-3 md:py-6 justify-around md:justify-between shrink-0 shadow-sm z-20">
        <div class="hidden md:flex w-12 h-12 bg-red-50/50 rounded-2xl items-center justify-center p-2 shadow-inner border border-red-100">
            <img src="../assets/logo ipuzpita kotak.ico" alt="Logo IpuzPita" class="w-full h-full object-contain" onerror="this.src='../assets/images/logo_ipuzpita.png'">
        </div>

        <div class="flex md:flex-col gap-4 md:gap-6 items-center">
            <a href="dashboard.html" class="w-10 h-10 md:w-12 md:h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center hover:bg-slate-100 transition" title="Dashboard">📊</a>
            <a href="buat_nota.html" class="w-10 h-10 md:w-12 md:h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center hover:bg-slate-100 transition" title="Buat Nota">📝</a>
            <a href="riwayat.html" class="w-10 h-10 md:w-12 md:h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center hover:bg-slate-100 transition" title="Riwayat Pesanan">📜</a>
            <a href="keuangan.html" class="w-10 h-10 md:w-12 md:h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center hover:bg-slate-100 transition" title="Keuangan">💰</a>
        </div>

        <div class="hidden md:flex flex-col gap-4 items-center">
            <a href="login.html" class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center hover:bg-red-100 transition" title="Keluar">🚪</a>
        </div>
    </aside>

    <!-- 2. KONTEN UTAMA DP MASUK -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- Top Bar Header -->
        <header class="h-16 md:h-20 bg-white border-b border-slate-100 px-4 md:px-8 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="w-9 h-9 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl flex items-center justify-center font-bold text-sm transition">‹</a>
                <div>
                    <h1 class="text-base md:text-xl font-bold text-slate-900">Daftar Down Payment (DP) Masuk 💳</h1>
                    <p class="hidden md:block text-xs text-slate-400">Riwayat pembayaran uang muka (DP) dari pesanan klien.</p>
                </div>
            </div>

            <div class="hidden sm:block bg-slate-50 px-4 py-2 rounded-2xl border border-slate-100 text-xs font-semibold text-slate-600 shadow-sm" id="current-date-badge">
                📅 Memuat tanggal...
            </div>
        </header>

        <!-- Main Body Scrollable -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 flex flex-col gap-6">
            
            <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 md:p-6 flex flex-col gap-4">
                <h3 class="text-sm md:text-base font-bold text-slate-800 border-b border-slate-100 pb-3">Pesanan dengan Status DP Masuk</h3>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-100">
                                <th class="py-3 px-4 font-semibold">No. Invoice</th>
                                <th class="py-3 px-4 font-semibold">Nama Klien</th>
                                <th class="py-3 px-4 font-semibold">Tanggal Acara</th>
                                <th class="py-3 px-4 font-semibold">Nominal DP</th>
                                <th class="py-3 px-4 font-semibold">Sisa Tagihan</th>
                                <th class="py-3 px-4 font-semibold text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelDpBody" class="divide-y divide-slate-100 text-slate-700">
                            <tr><td colspan="6" class="text-center py-8 text-slate-400">Memuat data dari database...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Script Sinkronisasi Data DP -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const todayStr = new Date().toLocaleDateString('id-ID', options);
            const dateBadge = document.getElementById('current-date-badge');
            if (dateBadge) dateBadge.innerText = `📅 ${todayStr}`;

            muatDataDPMasuk();
        });

        async function muatDataDPMasuk() {
            const tbody = document.getElementById('tabelDpBody');
            try {
                let response = await fetch('/api/semua_riwayat');
                let res = await response.json();

                if (res && res.status === 'success') {
                    // Filter hanya yang statusnya 'DP Masuk'
                    let listDp = (res.data || []).filter(item => item.status === 'DP Masuk');

                    if (listDp.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">Tidak ada pesanan dengan status DP Masuk saat ini.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = listDp.map(item => {
                        let cleanInv = (item.no_inv || '').replace(/#/g, '');
                        let sisa = Math.max(0, item.total - item.dp);
                        return `
                            <tr class="hover:bg-slate-50 transition">
                                <td class="py-4 px-4 font-bold text-red-600">#${cleanInv}</td>
                                <td class="py-4 px-4 font-medium text-slate-800">${item.nama}</td>
                                <td class="py-4 px-4 text-xs text-slate-500">${item.tanggal || '-'}</td>
                                <td class="py-4 px-4 font-bold text-emerald-600">${formatRupiah(item.dp)}</td>
                                <td class="py-4 px-4 font-bold text-amber-600">${formatRupiah(sisa)}</td>
                                <td class="py-4 px-4 text-center">
                                    <button onclick="window.location.href='edit_nota.html?inv=${cleanInv}'" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-xl font-semibold text-xs transition transform hover:scale-105">✏️ Kelola Nota</button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-rose-500">Gagal memuat data dari server.</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-rose-500">Kesalahan jaringan saat terhubung ke server.</td></tr>`;
            }
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }
    </script>
</body>
</html>
